<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>GARDENS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GARDENS">
<meta name="theme-color" content="#f2f2f7">
<style>
  :root{
    --blue:#007aff;
    --brown:#8a6d4f;
    --bg:#f2f2f7;
    --card:#ffffff;
    --sep:#e5e5ea;
    --ink:#1c1c1e;
    --gray:#8e8e93;
    --red:#ff3b30;
    --tabbar:76px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-user-select:none; user-select:none;
    touch-action:manipulation;
    overscroll-behavior:none;
  }
  .panel{
    display:none;
    position:fixed; inset:0;
    padding-top:env(safe-area-inset-top);
    padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom));
    overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .panel.active{display:block;}

  /* ---------- Counter ---------- */
  #tab-counter{display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center;}
  #tab-counter.active{display:flex;}
  .ct-label{color:var(--gray); font-size:20px; margin-bottom:24px;}
  .ct-num{font-size:96px; font-weight:800; line-height:1; letter-spacing:-2px;}
  .ct-btns{display:flex; gap:44px; margin-top:40px;}
  .ct-btn{
    width:64px;height:64px;border-radius:50%;border:none;background:var(--blue);color:#fff;
    font-size:34px; font-weight:400; display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .ct-btn:active{opacity:.7; transform:scale(.94);}
  .ct-when{margin-top:36px;color:var(--gray);font-size:15px;}

  /* ---------- shared header ---------- */
  .hdr{padding:8px 18px 4px;}
  .hdr-row{display:flex;align-items:center;justify-content:space-between;min-height:34px;}
  .hdr-title{font-size:34px;font-weight:800;letter-spacing:-.5px;margin:2px 0 12px;}
  .hbtn{background:none;border:none;color:var(--blue);font-size:17px;padding:6px 2px;cursor:pointer;}
  .hbtn.plus{font-size:30px;font-weight:300;line-height:1;}

  /* ---------- list ---------- */
  .list{
    background:var(--card); border-radius:12px; margin:0 16px;
    overflow:hidden;
  }
  .row{
    display:flex; align-items:center; gap:12px;
    padding:14px 16px; background:var(--card);
    position:relative;
  }
  .row:not(:last-child)::after{
    content:""; position:absolute; left:16px; right:0; bottom:0; height:1px; background:var(--sep);
  }
  .row.dragging{background:#fafafa; box-shadow:0 8px 24px rgba(0,0,0,.16); border-radius:10px; z-index:5;}
  .row.dragging::after{display:none;}
  .list.sorting .row{transition:none;}

  .link-name{color:var(--brown); font-size:18px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .chev{color:#c7c7cc; font-size:20px;}

  .todo-text{flex:1; font-size:18px; min-width:0; word-break:break-word;}
  .todo-text.done{color:var(--gray); text-decoration:line-through;}

  .circle{
    width:26px;height:26px;border-radius:50%;border:2px solid #c7c7cc;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;cursor:pointer;background:none;padding:0;
  }
  .circle.on{background:var(--blue);border-color:var(--blue);}
  .circle.on svg{display:block;}
  .circle svg{display:none;width:15px;height:15px;}

  .del{
    width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;border:none;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer;font-size:22px;line-height:1;
  }
  .del svg{width:12px;height:2px;}
  .handle{
    color:#c7c7cc; flex:0 0 auto; padding:6px; margin:-6px -6px -6px 0;
    touch-action:none; cursor:grab; display:flex;align-items:center;
  }
  .empty{color:var(--gray);text-align:center;font-size:16px;padding:40px 20px;}

  /* ---------- tab bar ---------- */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    height:calc(var(--tabbar) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    background:rgba(249,249,249,.94); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    border-top:1px solid rgba(0,0,0,.12);
    display:flex;
  }
  .tab{
    flex:1; border:none;background:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--gray); font-size:11px; padding-top:8px;
  }
  .tab svg{width:27px;height:27px;}
  .tab.on{color:var(--blue);}

  /* ---------- add modal ---------- */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none;align-items:center;justify-content:center;padding:24px;}
  .mask.show{display:flex;}
  .dialog{background:var(--card);border-radius:16px;width:100%;max-width:330px;padding:20px;}
  .dialog h3{margin:2px 0 16px;font-size:19px;text-align:center;}
  .dialog input{
    width:100%;border:none;background:var(--bg);border-radius:10px;padding:12px 14px;font-size:16px;
    margin-bottom:10px;color:var(--ink);-webkit-user-select:text;user-select:text;
  }
  .dialog input:focus{outline:2px solid var(--blue);}
  .dlg-btns{display:flex;gap:10px;margin-top:8px;}
  .dlg-btns button{flex:1;border:none;border-radius:10px;padding:12px;font-size:16px;cursor:pointer;}
  .btn-cancel{background:var(--bg);color:var(--ink);}
  .btn-ok{background:var(--blue);color:#fff;font-weight:600;}

  /* add-todo input */
  .todo-add{display:flex;align-items:center;gap:10px;padding:0 16px 14px;}
  .todo-add input{
    flex:1;border:none;background:var(--card);border-radius:10px;padding:13px 14px;font-size:17px;color:var(--ink);
    -webkit-user-select:text;user-select:text;
  }
  .todo-add input:focus{outline:none;}
  .todo-add .addbtn{background:none;border:none;color:var(--blue);font-size:17px;cursor:pointer;padding:8px;}
</style>
</head>
<body>

<!-- ========== COUNTER ========== -->
<section id="tab-counter" class="panel active">
  <div class="ct-label">カウンター</div>
  <div class="ct-num" id="ctNum">0</div>
  <div class="ct-btns">
    <button class="ct-btn" id="ctMinus" aria-label="減らす">−</button>
    <button class="ct-btn" id="ctPlus" aria-label="増やす">＋</button>
  </div>
  <div class="ct-when" id="ctWhen">更新日時：—</div>
</section>

<!-- ========== WEB ========== -->
<section id="tab-web" class="panel">
  <div class="hdr">
    <div class="hdr-row">
      <button class="hbtn" id="webEdit">並び替え</button>
      <button class="hbtn plus" id="webAdd">＋</button>
    </div>
    <div class="hdr-title">リンク一覧</div>
  </div>
  <div class="list" id="webList"></div>
</section>

<!-- ========== TODO ========== -->
<section id="tab-todo" class="panel">
  <div class="hdr">
    <div class="hdr-row">
      <div class="hdr-title" style="margin:0;">予定</div>
      <button class="hbtn" id="todoEdit">並び替え</button>
    </div>
  </div>
  <div class="todo-add">
    <input id="todoInput" placeholder="新しい予定を入力" enterkeyhint="done">
    <button class="addbtn" id="todoAddBtn">追加</button>
  </div>
  <div class="list" id="todoList"></div>
</section>

<!-- ========== TAB BAR ========== -->
<nav class="tabbar">
  <button class="tab on" data-tab="counter">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h6M7 5v6"/><path d="M14 17h6"/><path d="M5 19l4-4M9 19l-4-4"/></svg>
    カウンター
  </button>
  <button class="tab" data-tab="web">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z" fill="currentColor" stroke="none"/></svg>
    Web
  </button>
  <button class="tab" data-tab="todo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5 5-5.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    ToDo
  </button>
</nav>

<!-- ========== ADD LINK DIALOG ========== -->
<div class="mask" id="linkMask">
  <div class="dialog">
    <h3 id="linkDlgTitle">リンクを追加</h3>
    <input id="linkName" placeholder="名前（例：JAL 発着案内）" enterkeyhint="next">
    <input id="linkUrl" placeholder="URL（例：jal.co.jp）" inputmode="url" autocapitalize="off" enterkeyhint="done">
    <div class="dlg-btns">
      <button class="btn-cancel" id="linkCancel">キャンセル</button>
      <button class="btn-ok" id="linkOk">保存</button>
    </div>
  </div>
</div>

<script>
"use strict";
const KEY = "gardensTools_v1";
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 6.5"/></svg>';
const MINUS = '<svg viewBox="0 0 14 2"><rect width="14" height="2" rx="1" fill="#fff"/></svg>';
const GRIP  = '<svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor"><circle cx="7" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="7" cy="11" r="1.6"/><circle cx="15" cy="11" r="1.6"/><circle cx="7" cy="16" r="1.6"/><circle cx="15" cy="16" r="1.6"/></svg>';

/* ---------- state ---------- */
let state = load();
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && typeof s==="object") return normalize(s);
  }catch(e){}
  return {counter:{value:0,updated:null}, links:[], todos:[]};
}
function normalize(s){
  s.counter = s.counter || {value:0,updated:null};
  s.links = Array.isArray(s.links)? s.links : [];
  s.todos = Array.isArray(s.todos)? s.todos : [];
  return s;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}
let _id = Date.now();
function uid(){ return "i"+(_id++).toString(36); }

/* ---------- tabs ---------- */
document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click", ()=>{
    const name = t.dataset.tab;
    document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on", x===t));
    document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active", p.id==="tab-"+name));
  });
});

/* ---------- counter ---------- */
const ctNum = document.getElementById("ctNum");
const ctWhen = document.getElementById("ctWhen");
function fmtDT(ms){
  if(!ms) return "—";
  const d = new Date(ms), p = n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function renderCounter(){
  ctNum.textContent = state.counter.value;
  ctWhen.textContent = "更新日時：" + fmtDT(state.counter.updated);
}
function bump(n){
  const v = state.counter.value + n;
  if(v < 0) return;
  state.counter.value = v;
  state.counter.updated = Date.now();
  save(); renderCounter();
}
document.getElementById("ctPlus").addEventListener("click", ()=>bump(1));
document.getElementById("ctMinus").addEventListener("click", ()=>bump(-1));

/* ---------- reorder (pointer drag from .handle) ---------- */
function makeSortable(listEl, onReorder){
  let dragEl=null, grabOffset=0, active=false;
  listEl.addEventListener("pointerdown", e=>{
    const handle = e.target.closest(".handle");
    if(!handle || !listEl.contains(handle)) return;
    const item = e.target.closest("[data-id]");
    if(!item) return;
    e.preventDefault();
    dragEl=item; active=true;
    try{ item.setPointerCapture(e.pointerId); }catch(_){}
    listEl.classList.add("sorting");
    item.classList.add("dragging");
    const r=item.getBoundingClientRect();
    grabOffset = e.clientY - r.top;
    document.addEventListener("pointermove", onMove, {passive:false});
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
  });
  function onMove(e){
    if(!active) return;
    e.preventDefault();
    const y = e.clientY;
    dragEl.style.transform="none";
    const dr = dragEl.getBoundingClientRect();
    const center = (y - grabOffset) + dr.height/2;
    const sibs = [...listEl.querySelectorAll("[data-id]")].filter(s=>s!==dragEl);
    let ref=null;
    for(const s of sibs){ const rr=s.getBoundingClientRect(); if(center < rr.top+rr.height/2){ ref=s; break; } }
    if(ref) listEl.insertBefore(dragEl, ref); else listEl.appendChild(dragEl);
    dragEl.style.transform="none";
    const nr = dragEl.getBoundingClientRect();
    dragEl.style.transform = `translateY(${y - grabOffset - nr.top}px)`;
  }
  function onUp(){
    if(!active) return;
    active=false;
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
    dragEl.style.transform="";
    dragEl.classList.remove("dragging");
    listEl.classList.remove("sorting");
    const ids = [...listEl.querySelectorAll("[data-id]")].map(el=>el.dataset.id);
    dragEl=null;
    onReorder(ids);
  }
}
function reorderBy(arr, ids){
  const map = new Map(arr.map(o=>[o.id,o]));
  return ids.map(id=>map.get(id)).filter(Boolean);
}

/* ---------- web (links) ---------- */
const webList = document.getElementById("webList");
let webEditing = false;
function normalizeUrl(u){
  u = u.trim();
  if(!u) return "";
  if(!/^https?:\/\//i.test(u)) u = "https://" + u;
  return u;
}
function renderWeb(){
  webList.innerHTML = "";
  if(state.links.length===0){
    const e=document.createElement("div"); e.className="empty";
    e.textContent = "「＋」でリンクを追加";
    webList.appendChild(e);
    document.getElementById("webEdit").style.visibility = "hidden";
    return;
  }
  document.getElementById("webEdit").style.visibility = "visible";
  state.links.forEach(l=>{
    const row=document.createElement("div"); row.className="row"; row.dataset.id=l.id;
    if(webEditing){
      const del=document.createElement("button"); del.className="del"; del.innerHTML=MINUS;
      del.addEventListener("click",ev=>{ev.stopPropagation(); state.links=state.links.filter(x=>x.id!==l.id); save(); renderWeb();});
      row.appendChild(del);
    }
    const name=document.createElement("div"); name.className="link-name"; name.textContent=l.name;
    row.appendChild(name);
    if(webEditing){
      const h=document.createElement("div"); h.className="handle"; h.innerHTML=GRIP;
      row.appendChild(h);
    }else{
      const c=document.createElement("div"); c.className="chev"; c.textContent="›";
      row.appendChild(c);
      row.addEventListener("click", ()=>{ if(l.url) window.open(l.url,"_blank"); });
    }
    webList.appendChild(row);
  });
}
document.getElementById("webEdit").addEventListener("click", ()=>{
  webEditing=!webEditing;
  document.getElementById("webEdit").textContent = webEditing? "完了":"並び替え";
  renderWeb();
});
makeSortable(webList, ids=>{ state.links = reorderBy(state.links, ids); save(); });

/* add-link dialog */
const linkMask=document.getElementById("linkMask");
const linkName=document.getElementById("linkName");
const linkUrl=document.getElementById("linkUrl");
function openLinkDlg(){ linkName.value=""; linkUrl.value=""; linkMask.classList.add("show"); setTimeout(()=>linkName.focus(),50); }
function closeLinkDlg(){ linkMask.classList.remove("show"); }
document.getElementById("webAdd").addEventListener("click", openLinkDlg);
document.getElementById("linkCancel").addEventListener("click", closeLinkDlg);
linkMask.addEventListener("click", e=>{ if(e.target===linkMask) closeLinkDlg(); });
document.getElementById("linkOk").addEventListener("click", ()=>{
  const n=linkName.value.trim(); const u=normalizeUrl(linkUrl.value);
  if(!n && !u) return;
  state.links.push({id:uid(), name:n||u, url:u});
  save(); renderWeb(); closeLinkDlg();
});
linkName.addEventListener("keydown", e=>{ if(e.key==="Enter") linkUrl.focus(); });
linkUrl.addEventListener("keydown", e=>{ if(e.key==="Enter") document.getElementById("linkOk").click(); });

/* ---------- todo ---------- */
const todoList=document.getElementById("todoList");
const todoInput=document.getElementById("todoInput");
let todoEditing=false;
function renderTodo(){
  todoList.innerHTML="";
  if(state.todos.length===0){
    const e=document.createElement("div"); e.className="empty"; e.textContent="予定はありません";
    todoList.appendChild(e);
    document.getElementById("todoEdit").style.visibility="hidden";
    return;
  }
  document.getElementById("todoEdit").style.visibility="visible";
  state.todos.forEach(t=>{
    const row=document.createElement("div"); row.className="row"; row.dataset.id=t.id;
    if(todoEditing){
      const del=document.createElement("button"); del.className="del"; del.innerHTML=MINUS;
      del.addEventListener("click",ev=>{ev.stopPropagation(); state.todos=state.todos.filter(x=>x.id!==t.id); save(); renderTodo();});
      row.appendChild(del);
    }else{
      const c=document.createElement("button"); c.className="circle"+(t.done?" on":""); c.innerHTML=CHECK;
      c.addEventListener("click",()=>{ t.done=!t.done; save(); renderTodo(); });
      row.appendChild(c);
    }
    const tx=document.createElement("div"); tx.className="todo-text"+(t.done?" done":""); tx.textContent=t.text;
    row.appendChild(tx);
    if(todoEditing){
      const h=document.createElement("div"); h.className="handle"; h.innerHTML=GRIP;
      row.appendChild(h);
    }
    todoList.appendChild(row);
  });
}
function addTodo(){
  const v=todoInput.value.trim();
  if(!v) return;
  state.todos.push({id:uid(), text:v, done:false});
  todoInput.value=""; save(); renderTodo();
}
document.getElementById("todoAddBtn").addEventListener("click", addTodo);
todoInput.addEventListener("keydown", e=>{ if(e.key==="Enter"){ addTodo(); } });
document.getElementById("todoEdit").addEventListener("click", ()=>{
  todoEditing=!todoEditing;
  document.getElementById("todoEdit").textContent = todoEditing? "完了":"並び替え";
  renderTodo();
});
makeSortable(todoList, ids=>{ state.todos = reorderBy(state.todos, ids); save(); });

/* prevent double-tap zoom / pinch */
document.addEventListener("gesturestart", e=>e.preventDefault());

/* ---------- init ---------- */
renderCounter(); renderWeb(); renderTodo();
</script>
</body>
</html>
