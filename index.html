<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>GARDENS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GARDENS">
<meta name="theme-color" content="#4A3520">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --blue:#007aff; --brown:#8a6d4f; --bg:#f2f2f7; --card:#ffffff;
    --sep:#e5e5ea; --ink:#1c1c1e; --gray:#8e8e93; --red:#ff3b30; --tabbar:58px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    touch-action:manipulation; overscroll-behavior:none;
  }
  .panel{
    display:none; position:fixed; inset:0;
    padding-top:env(safe-area-inset-top);
    padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom));
    overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .panel.active{display:block;}

  #tab-counter{display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center;}
  #tab-counter.active{display:flex;}
  .ct-label{color:var(--gray); font-size:20px; margin-bottom:24px;}
  .ct-num{font-size:96px; font-weight:800; line-height:1; letter-spacing:-2px;}
  .ct-btns{display:flex; gap:44px; margin-top:40px;}
  .ct-btn{width:64px;height:64px;border-radius:50%;border:none;background:var(--blue);color:#fff;
    font-size:34px; display:flex;align-items:center;justify-content:center; cursor:pointer;}
  .ct-btn:active{opacity:.7; transform:scale(.94);}
  .ct-reset{margin-top:26px;background:none;border:none;color:var(--blue);font-size:16px;cursor:pointer;padding:6px 16px;}
  .ct-reset:active{opacity:.6;}
  .ct-when{margin-top:18px;color:var(--gray);font-size:15px;}
  .ver{margin-top:10px;color:#c7c7cc;font-size:12px;}

  .hdr{padding:8px 18px 4px;}
  .hdr-row{display:flex;align-items:center;justify-content:space-between;min-height:34px;}
  .hdr-title{font-size:34px;font-weight:800;letter-spacing:-.5px;margin:2px 0 12px;}
  .hbtn{background:none;border:none;color:var(--blue);font-size:17px;padding:6px 2px;cursor:pointer;}
  .hbtn.plus{font-size:30px;font-weight:300;line-height:1;}
  .hint{color:var(--gray);font-size:12.5px;padding:0 18px 8px;}

  .list{position:relative; background:var(--card); border-radius:12px; margin:0 16px; overflow:hidden;}
  .row{position:relative; background:var(--card); overflow:hidden;}
  .row.dragging{z-index:6; box-shadow:0 10px 26px rgba(0,0,0,.18); border-radius:10px; overflow:visible;}
  .cell{position:relative; z-index:1; background:var(--card);
    display:flex; align-items:center; gap:12px; padding:15px 16px; -webkit-touch-callout:none;}
  .row:not(:last-child) .cell::after{content:""; position:absolute; left:0; right:-16px; bottom:0; height:1px; background:var(--sep);}
  .row.dragging .cell::after{display:none;}
  .row.merge-target .cell{ background:#e9f1ff; box-shadow:inset 0 0 0 2px var(--blue); border-radius:10px; }
  .fic{flex:0 0 auto; width:26px; height:26px; display:flex; align-items:center; justify-content:center;}
  .link-name{color:var(--brown); font-size:18px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .folder-name{color:var(--ink); font-size:18px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .count{color:var(--gray); font-size:15px; margin-left:2px;}
  .chev{color:#c7c7cc; font-size:20px;}
  .todo-text{flex:1; font-size:18px; min-width:0; word-break:break-word;}
  .drop-line{position:absolute; left:16px; right:16px; height:2px; background:var(--blue); border-radius:2px; z-index:7; pointer-events:none; margin-top:-1px;}
  .delbg{position:absolute; inset:0; background:var(--red); display:flex; align-items:center; justify-content:flex-end;
    padding-right:24px; color:#fff; z-index:0; font-size:16px;}
  .empty{color:var(--gray);text-align:center;font-size:16px;padding:40px 20px;}

  /* subscription cards (wallet) */
  .cardstack{padding:6px 16px 24px;}
  .wcard{position:relative; border-radius:16px; color:#fff; padding:15px 18px; margin-top:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.18); cursor:pointer; overflow:hidden;}
  .wcard:first-child{margin-top:2px;}
  .wcard.dragging{z-index:8; box-shadow:0 14px 30px rgba(0,0,0,.32);}
  .wc-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px;}
  .wc-company{font-size:16px; font-weight:600; opacity:.92; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .wc-title{font-size:19px; font-weight:800; text-align:right; min-width:0; max-width:62%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .wc-body{display:block; margin-top:14px;}
  .wc-amount{font-size:18px; font-weight:700;}
  .wc-memo{font-size:14px; opacity:.9; margin-top:8px; white-space:pre-wrap; word-break:break-word;}
  .wc-actions{display:flex; gap:10px; margin-top:16px;}
  .wc-actions button{border:none; border-radius:9px; padding:9px 16px; font-size:14px;
    background:rgba(255,255,255,.22); color:#fff; cursor:pointer;}

  .tabbar{position:fixed; left:0; right:0; bottom:0; z-index:20;
    padding-top:9px;
    padding-bottom:max(8px, env(safe-area-inset-bottom));
    background:#ffffff; box-shadow:0 -0.5px 0 rgba(0,0,0,.14);
    border-top:1px solid rgba(0,0,0,.08); display:flex;}
  .tab{flex:1; border:none;background:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    color:var(--gray); font-size:10px; padding:0;}
  .tab svg{width:23px;height:23px;}
  .tab.on{color:var(--blue);}

  .folderview{position:fixed; inset:0; z-index:30; background:var(--bg); display:none; flex-direction:column;
    padding-top:env(safe-area-inset-top); padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom));}
  .folderview.show{display:flex;}
  .fv-bar{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 14px 2px;}
  .fv-title{font-size:17px; font-weight:600; flex:1; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .fv-back{color:var(--blue); font-size:17px; background:none; border:none; cursor:pointer; white-space:nowrap;}
  .fv-list-wrap{overflow-y:auto; -webkit-overflow-scrolling:touch; padding-top:4px;}

  .mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:none;align-items:center;justify-content:center;padding:24px;}
  .mask.show{display:flex;}
  .dialog{background:var(--card);border-radius:16px;width:100%;max-width:330px;padding:20px;max-height:86vh;overflow-y:auto;}
  .dialog h3{margin:2px 0 16px;font-size:19px;text-align:center;}
  .dialog input,.dialog textarea{width:100%;border:none;background:var(--bg);border-radius:10px;padding:12px 14px;font-size:16px;
    margin-bottom:10px;color:var(--ink);font-family:inherit;-webkit-user-select:text;user-select:text;}
  .dialog textarea{min-height:70px;resize:none;}
  .dialog input:focus,.dialog textarea:focus{outline:2px solid var(--blue);}
  .swatches{display:flex;gap:10px;margin:2px 0 14px;flex-wrap:wrap;}
  .sw{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;}
  .sw.on{border-color:var(--ink);}
  .dlg-btns{display:flex;gap:10px;margin-top:8px;}
  .dlg-btns button{flex:1;border:none;border-radius:10px;padding:12px;font-size:16px;cursor:pointer;}
  .btn-cancel{background:var(--bg);color:var(--ink);}
  .btn-ok{background:var(--blue);color:#fff;font-weight:600;}

  /* long-press action sheet */
  .sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:70;display:none;align-items:flex-end;justify-content:center;
    padding:10px calc(10px + env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));}
  .sheet-mask.show{display:flex;}
  .sheet{width:100%;max-width:440px;}
  .sheet-group{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:8px;}
  .sheet-title{text-align:center;color:var(--gray);font-size:13px;padding:14px 16px;border-bottom:1px solid var(--sep);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sheet-group button{width:100%;border:none;background:var(--card);padding:16px;font-size:18px;color:var(--blue);cursor:pointer;
    border-bottom:1px solid var(--sep);}
  .sheet-group button:last-child{border-bottom:none;}
  .sheet-group button.danger{color:var(--red);}
  .sheet-cancel{width:100%;border:none;background:var(--card);border-radius:14px;padding:16px;font-size:18px;font-weight:600;color:var(--blue);cursor:pointer;}

  .todo-add{display:flex;align-items:center;gap:10px;padding:0 16px 6px;}
  .todo-add input{flex:1;border:none;background:var(--card);border-radius:10px;padding:13px 14px;font-size:17px;color:var(--ink);
    -webkit-user-select:text;user-select:text;}
  .todo-add input:focus{outline:none;}
  .todo-add .addbtn{background:none;border:none;color:var(--blue);font-size:17px;cursor:pointer;padding:8px;}
</style>
</head>
<body>

<section id="tab-counter" class="panel active">
  <div class="ct-label">カウンター</div>
  <div class="ct-num" id="ctNum">0</div>
  <div class="ct-btns">
    <button class="ct-btn" id="ctMinus" aria-label="減らす">−</button>
    <button class="ct-btn" id="ctPlus" aria-label="増やす">＋</button>
  </div>
  <button class="ct-reset" id="ctReset">リセット</button>
  <div class="ct-when" id="ctWhen">更新日時：—</div>
  <div class="ver" id="ver"></div>
</section>

<section id="tab-web" class="panel">
  <div class="hdr">
    <div class="hdr-row"><span></span><button class="hbtn plus" id="webAdd">＋</button></div>
    <div class="hdr-title">リンク一覧</div>
  </div>
  <div class="hint">タップで開く・長押しでメニュー（編集/削除）・長押しして移動で並び替え（中央に重ねてフォルダ）</div>
  <div class="list" id="webList"></div>
</section>

<section id="tab-todo" class="panel">
  <div class="hdr"><div class="hdr-title">予定</div></div>
  <div class="todo-add">
    <input id="todoInput" placeholder="新しい予定を入力" enterkeyhint="done">
    <button class="addbtn" id="todoAddBtn">追加</button>
  </div>
  <div class="hint">タップで編集・長押しで並び替え・左スワイプで削除</div>
  <div class="list" id="todoList"></div>
</section>

<section id="tab-cards" class="panel">
  <div class="hdr">
    <div class="hdr-row"><span></span><button class="hbtn plus" id="cardAdd">＋</button></div>
    <div class="hdr-title">サブスク</div>
  </div>
  <div class="hint">タップで開く・長押しして移動で並び替え・「＋」で追加</div>
  <div class="cardstack" id="cardStack"></div>
</section>

<nav class="tabbar">
  <button class="tab on" data-tab="counter">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h6M7 5v6"/><path d="M14 17h6"/><path d="M5 19l4-4M9 19l-4-4"/></svg>
    カウンター
  </button>
  <button class="tab" data-tab="web">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z" fill="currentColor" stroke="none"/></svg>
    Web
  </button>
  <button class="tab" data-tab="todo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5 5-5.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    ToDo
  </button>
  <button class="tab" data-tab="cards">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></svg>
    サブスク
  </button>
</nav>

<section id="folderView" class="folderview">
  <div class="fv-bar">
    <button class="fv-back" id="fvBack">‹ 一覧</button>
    <div class="fv-title" id="fvTitle">フォルダ</div>
    <button class="hbtn plus" id="fvAdd">＋</button>
  </div>
  <div class="hint" style="text-align:center;">名前をタップで変更・タップで開く・長押しでメニュー・長押しして移動で並び替え</div>
  <div class="fv-list-wrap"><div class="list" id="folderList"></div></div>
</section>

<div class="mask" id="linkMask">
  <div class="dialog">
    <h3 id="linkDlgTitle">リンクを追加</h3>
    <input id="linkName" placeholder="名前（例：JAL 発着案内）" enterkeyhint="next">
    <input id="linkUrl" placeholder="URL（例：jal.co.jp）" inputmode="url" autocapitalize="off" enterkeyhint="done">
    <div class="dlg-btns">
      <button class="btn-cancel" id="linkCancel">キャンセル</button>
      <button class="btn-ok" id="linkOk">保存</button>
    </div>
  </div>
</div>

<div class="mask" id="todoMask">
  <div class="dialog">
    <h3>予定を編集</h3>
    <input id="todoEditInput" placeholder="予定" enterkeyhint="done">
    <div class="dlg-btns">
      <button class="btn-cancel" id="todoCancel">キャンセル</button>
      <button class="btn-ok" id="todoOk">保存</button>
    </div>
  </div>
</div>

<div class="mask" id="renameMask">
  <div class="dialog">
    <h3>フォルダ名</h3>
    <input id="renameInput" placeholder="フォルダ名" enterkeyhint="done">
    <div class="dlg-btns">
      <button class="btn-cancel" id="renameCancel">キャンセル</button>
      <button class="btn-ok" id="renameOk">保存</button>
    </div>
  </div>
</div>

<div class="mask" id="cardMask">
  <div class="dialog">
    <h3 id="cardDlgTitle">サブスクを追加</h3>
    <input id="cCompany" placeholder="会社名" enterkeyhint="next">
    <input id="cItem" placeholder="品名（プラン名など）" enterkeyhint="next">
    <input id="cAmount" placeholder="金額（例：1480）" inputmode="numeric" enterkeyhint="next">
    <textarea id="cMemo" placeholder="メモ"></textarea>
    <div class="swatches" id="cSwatches"></div>
    <div class="dlg-btns">
      <button class="btn-cancel" id="cardCancel">キャンセル</button>
      <button class="btn-ok" id="cardOk">保存</button>
    </div>
  </div>
</div>

<div class="sheet-mask" id="sheetMask">
  <div class="sheet">
    <div class="sheet-group">
      <div class="sheet-title" id="sheetTitle"></div>
      <div id="sheetActions"></div>
    </div>
    <button class="sheet-cancel" id="sheetCancel">キャンセル</button>
  </div>
</div>

<script>
"use strict";
const KEY = "gardensTools_v1";

/* ---------- state ---------- */
let state = load();
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && typeof s==="object"){
      s.counter = s.counter || {value:0,updated:null};
      s.links = Array.isArray(s.links)? s.links : [];
      s.todos = Array.isArray(s.todos)? s.todos.map(t=>({id:t.id, text:t.text})) : [];
      s.cards = Array.isArray(s.cards)? s.cards : [];
      return s;
    }
  }catch(e){}
  return {counter:{value:0,updated:null}, links:[], todos:[], cards:[]};
}
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
let _id = Date.now();
function uid(){ return "i"+(_id++).toString(36); }

/* ---------- cloud sync (Firebase Realtime DB, reused lounge-ako project) ---------- */
const FIREBASE_CONFIG={
  apiKey:"AIzaSyC8JDLV0ByHq-dWB_E97cnv_DVIOmndqPU",
  authDomain:"lounge-ako.firebaseapp.com",
  databaseURL:"https://lounge-ako-default-rtdb.firebaseio.com",
  projectId:"lounge-ako",
  storageBucket:"lounge-ako.firebasestorage.app",
  messagingSenderId:"566425981436",
  appId:"1:566425981436:web:c72b2c7e6bf5d3f6a82279"
};
const ROOM='gardens-tools-main';
let cloudRef=null, cloudOn=false, saveTimer=null, applyingRemote=false;
function hasFirebase(){ return FIREBASE_CONFIG.apiKey && typeof firebase!=='undefined'; }

/* every mutation calls save(): write locally + push to cloud (debounced) */
function save(){
  saveLocal();
  if(cloudOn && cloudRef && !applyingRemote){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{ cloudRef.set(state).catch(()=>{}); }, 250);
  }
}
function renderAll(){
  renderCounter(); renderWeb(); renderTodo(); renderCards();
  if(openFolderId){ if(topById(openFolderId)) renderFolder(); else closeFolder(); }
}
function adopt(data){
  applyingRemote=true;
  state.counter = data.counter || {value:0,updated:null};
  state.links = Array.isArray(data.links)? data.links : [];
  state.todos = Array.isArray(data.todos)? data.todos.map(t=>({id:t.id,text:t.text})) : [];
  state.cards = Array.isArray(data.cards)? data.cards : [];
  saveLocal(); renderAll();
  applyingRemote=false;
}
function initCloud(){
  if(!hasFirebase()) return;
  try{
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    cloudRef=firebase.database().ref('rooms/'+ROOM); cloudOn=true;
    cloudRef.once('value').then(snap=>{
      const v=snap.val();
      if(v && typeof v==='object') adopt(v);          // cloud is source of truth -> restores data
      else cloudRef.set(state).catch(()=>{});          // first run: seed from this device
      cloudRef.on('value', s=>{ const d=s.val(); if(d && JSON.stringify(d)!==JSON.stringify(state)) adopt(d); });
    }).catch(()=>{ cloudOn=false; });
  }catch(e){ cloudOn=false; }
}
function registerSW(){
  if(!("serviceWorker" in navigator)) return;
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}

const isFolder = it => it && Array.isArray(it.items);
const isLink   = it => it && !Array.isArray(it.items);
function topById(id){ return state.links.find(x=>x.id===id); }
function findLinkAnywhere(id){
  let l = state.links.find(x=>isLink(x) && x.id===id); if(l) return l;
  for(const f of state.links){ if(isFolder(f)){ const g=f.items.find(x=>x.id===id); if(g) return g; } }
  return null;
}

/* ---------- tabs ---------- */
document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click", ()=>{
    closeFolder();
    const name = t.dataset.tab;
    document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on", x===t));
    document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active", p.id==="tab-"+name));
  });
});

/* ---------- counter ---------- */
const ctNum = document.getElementById("ctNum");
const ctWhen = document.getElementById("ctWhen");
function fmtDT(ms){
  if(!ms) return "—";
  const d = new Date(ms), p = n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function renderCounter(){ ctNum.textContent = state.counter.value; ctWhen.textContent = "更新日時：" + fmtDT(state.counter.updated); }
function bump(n){ const v=state.counter.value+n; if(v<0) return; state.counter.value=v; state.counter.updated=Date.now(); save(); renderCounter(); }
document.getElementById("ctPlus").addEventListener("click", ()=>bump(1));
document.getElementById("ctMinus").addEventListener("click", ()=>bump(-1));
document.getElementById("ctReset").addEventListener("click", ()=>{
  if(state.counter.value===0) return;
  if(!confirm("カウントを0にリセットしますか？")) return;
  state.counter.value=0; state.counter.updated=Date.now(); save(); renderCounter();
});

/* ---------- action sheet ---------- */
const sheetMask=document.getElementById("sheetMask");
const sheetTitle=document.getElementById("sheetTitle");
const sheetActions=document.getElementById("sheetActions");
function showSheet(title, actions){
  sheetTitle.textContent=title||""; sheetTitle.style.display=title?"block":"none";
  sheetActions.innerHTML="";
  actions.forEach(a=>{
    const b=document.createElement("button"); b.textContent=a.label; if(a.danger) b.classList.add("danger");
    b.addEventListener("click", ()=>{ closeSheet(); a.fn(); });
    sheetActions.appendChild(b);
  });
  sheetMask.classList.add("show");
}
function closeSheet(){ sheetMask.classList.remove("show"); }
document.getElementById("sheetCancel").addEventListener("click", closeSheet);
sheetMask.addEventListener("click", e=>{ if(e.target===sheetMask) closeSheet(); });

/* ---------- gesture engine ----------
   tap  -> onTap(id)
   long-press (still) -> onHold(id)   [menu]   or, if none, onTap
   long-press + move  -> drag (reorder; folders: also merge)
   swipe (opts.swipe) -> reveal/delete
------------------------------------- */
const SLOP=8, LONGPRESS=340, HOLD_MOVE=7;
function reorderBy(arr, ids){ const m=new Map(arr.map(o=>[o.id,o])); return ids.map(id=>m.get(id)).filter(Boolean); }
let swipeOpenRow=null;
function closeOpenRow(){ if(swipeOpenRow){ const c=swipeOpenRow.querySelector(".cell"); if(c){ c.style.transition="transform .2s"; c.style.transform="translateX(0)"; } swipeOpenRow=null; } }

function attachGestures(listEl, opts){
  let row, cell, sx, sy, curX, curY, hx, hy, t0, mode, lpTimer, grabOffset, revealW;
  let slots, draggedTop, mergeEl, mergeId, dropIndex, dropLine;
  const getPt = e => e.touches? (e.touches[0]||e.changedTouches[0]) : e;
  const rowSel = opts.rowSelector || ".row";

  function onStart(e){
    if(mode) return;
    if(e.target.closest("button")) return;
    const r = e.target.closest("[data-id]"); if(!r || !listEl.contains(r)) return;
    if(swipeOpenRow && swipeOpenRow!==r) closeOpenRow();
    row=r; cell=row.querySelector(".cell");
    const p=getPt(e); sx=p.clientX; sy=p.clientY; curX=p.clientX; curY=p.clientY; t0=Date.now(); mode="pending";
    revealW = opts.swipe==='reveal' ? (opts.actionsWidth||0) : 0;
    lpTimer=setTimeout(startHold, LONGPRESS);
    window.addEventListener("touchmove", onMove, {passive:false});
    window.addEventListener("touchend", onEnd);
    window.addEventListener("touchcancel", onEnd);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onEnd);
  }
  function startHold(){
    if(mode!=="pending") return;
    mode="held"; hx=curX; hy=curY;
    row.classList.add("dragging"); if(cell) cell.style.transition="";
    if(navigator.vibrate) navigator.vibrate(10);
    if(opts.folders){
      slots=[...listEl.querySelectorAll(rowSel)].map(r=>({el:r,id:r.dataset.id,rect:r.getBoundingClientRect()}));
      const d=slots.find(s=>s.id===row.dataset.id); draggedTop=d.rect.top; grabOffset=curY-draggedTop;
      mergeEl=null; mergeId=null; dropIndex=null;
      dropLine=document.createElement("div"); dropLine.className="drop-line"; dropLine.style.display="none"; listEl.appendChild(dropLine);
    } else grabOffset = curY - row.getBoundingClientRect().top;
  }
  function onMove(e){
    const p=getPt(e); const dx=p.clientX-sx, dy=p.clientY-sy; curX=p.clientX; curY=p.clientY;
    if(mode==="pending"){
      if(Math.hypot(dx,dy)>SLOP){
        clearTimeout(lpTimer);
        if(Math.abs(dx)>Math.abs(dy) && opts.swipe){ mode="swipe"; cell.style.transition=""; }
        else cleanup();
      }
      return;
    }
    if(mode==="swipe"){
      e.preventDefault();
      let base=(swipeOpenRow===row)?-revealW:0, tx=base+dx; if(tx>0)tx=0;
      if(opts.swipe==='reveal' && tx < -revealW-40) tx=-revealW-40;
      cell.style.transform=`translateX(${tx}px)`; return;
    }
    if(mode==="held"){
      e.preventDefault();
      if(Math.hypot(p.clientX-hx, p.clientY-hy) > HOLD_MOVE) mode="drag";
      else return;
    }
    if(mode==="drag"){ e.preventDefault(); if(opts.folders) dragFolders(); else dragShuffle(); }
  }
  function dragShuffle(){
    const y=curY; row.style.transform="none";
    const dr=row.getBoundingClientRect(); const center=(y-grabOffset)+dr.height/2;
    const sibs=[...listEl.querySelectorAll("[data-id]")].filter(s=>s!==row);
    let ref=null;
    for(const s of sibs){ const rr=s.getBoundingClientRect(); if(center<rr.top+rr.height/2){ ref=s; break; } }
    if(ref) listEl.insertBefore(row, ref); else listEl.appendChild(row);
    row.style.transform="none"; const nr=row.getBoundingClientRect();
    row.style.transform=`translateY(${y-grabOffset-nr.top}px)`;
  }
  function dragFolders(){
    const y=curY; row.style.transform=`translateY(${y-grabOffset-draggedTop}px)`;
    if(mergeEl){ mergeEl.classList.remove("merge-target"); mergeEl=null; mergeId=null; }
    const others=slots.filter(s=>s.id!==row.dataset.id);
    let hov=null; for(const s of others){ if(y>=s.rect.top && y<=s.rect.bottom){ hov=s; break; } }
    let merge=false;
    if(hov){
      const rel=(y-hov.rect.top)/hov.rect.height;
      if(rel>=0.3 && rel<=0.7 && opts.canMerge(row.dataset.id, hov.id)){
        mergeEl=hov.el; mergeId=hov.id; mergeEl.classList.add("merge-target"); merge=true; dropIndex=null; dropLine.style.display="none";
      }
    }
    if(!merge){
      let idx=0; for(const s of others){ if(y > (s.rect.top+s.rect.bottom)/2) idx++; }
      dropIndex=idx;
      if(others.length===0){ dropLine.style.display="none"; }
      else { const listTop=listEl.getBoundingClientRect().top;
        const t=(idx===0)? others[0].rect.top : others[idx-1].rect.bottom;
        dropLine.style.top=(t-listTop)+"px"; dropLine.style.display="block"; }
    }
  }
  function unlift(){
    row.style.transform=""; row.classList.remove("dragging");
    if(dropLine){ dropLine.remove(); dropLine=null; }
    if(mergeEl){ mergeEl.classList.remove("merge-target"); mergeEl=null; }
  }
  function onEnd(e){
    clearTimeout(lpTimer);
    if(mode==="pending"){
      const quick = Date.now()-t0 < LONGPRESS;
      if(swipeOpenRow) closeOpenRow();
      else if(quick && opts.onTap) opts.onTap(row.dataset.id);
    } else if(mode==="swipe"){
      const p=getPt(e); const dx=p.clientX-sx;
      if(opts.swipe==='delete'){
        const w=row.getBoundingClientRect().width;
        if(dx < -Math.min(w*0.4,110)){
          cell.style.transition="transform .18s"; cell.style.transform="translateX(-110%)";
          const id=row.dataset.id; setTimeout(()=>opts.onDelete(id),170);
        } else snapBack();
      } else {
        const base=(swipeOpenRow===row)?-revealW:0, tx=base+dx;
        if(tx < -revealW/2){ cell.style.transition="transform .2s"; cell.style.transform=`translateX(${-revealW}px)`; swipeOpenRow=row; }
        else { snapBack(); if(swipeOpenRow===row) swipeOpenRow=null; }
      }
    } else if(mode==="held"){
      const id=row.dataset.id; unlift();
      if(opts.onHold) opts.onHold(id); else if(opts.onTap) opts.onTap(id);
    } else if(mode==="drag"){
      const id=row.dataset.id, mid=mergeId, idx=dropIndex;
      const ids=[...listEl.querySelectorAll("[data-id]")].map(el=>el.dataset.id);
      unlift();
      if(opts.folders) opts.onDrop({draggedId:id, mergeId:mid, index:idx});
      else opts.onReorder(ids);
    }
    cleanup();
  }
  function snapBack(){ cell.style.transition="transform .2s"; cell.style.transform="translateX(0)"; }
  function cleanup(){
    mode=null;
    window.removeEventListener("touchmove", onMove); window.removeEventListener("touchend", onEnd);
    window.removeEventListener("touchcancel", onEnd); window.removeEventListener("mousemove", onMove);
    window.removeEventListener("mouseup", onEnd);
  }
  listEl.addEventListener("touchstart", onStart, {passive:true});
  listEl.addEventListener("mousedown", onStart);
}

/* ---------- web (links + folders) ---------- */
const webList = document.getElementById("webList");
const FOLDER_SVG = '<svg width="24" height="24" viewBox="0 0 24 24" fill="#e0b877"><path d="M4 5h5l2 2h9a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg>';
function normalizeUrl(u){ u=u.trim(); if(!u) return ""; if(!/^https?:\/\//i.test(u)) u="https://"+u; return u; }
function makeLinkRow(l){
  const row=document.createElement("div"); row.className="row"; row.dataset.id=l.id;
  const cell=document.createElement("div"); cell.className="cell";
  const name=document.createElement("div"); name.className="link-name"; name.textContent=l.name;
  const chev=document.createElement("div"); chev.className="chev"; chev.textContent="›";
  cell.appendChild(name); cell.appendChild(chev); row.appendChild(cell); return row;
}
function makeFolderRow(f){
  const row=document.createElement("div"); row.className="row"; row.dataset.id=f.id;
  const cell=document.createElement("div"); cell.className="cell";
  const ic=document.createElement("div"); ic.className="fic"; ic.innerHTML=FOLDER_SVG;
  const name=document.createElement("div"); name.className="folder-name"; name.textContent=f.name;
  const cnt=document.createElement("div"); cnt.className="count"; cnt.textContent="("+f.items.length+")";
  const chev=document.createElement("div"); chev.className="chev"; chev.textContent="›";
  cell.appendChild(ic); cell.appendChild(name); cell.appendChild(cnt); cell.appendChild(chev);
  row.appendChild(cell); return row;
}
function renderWeb(){
  webList.innerHTML="";
  if(state.links.length===0){
    const e=document.createElement("div"); e.className="empty"; e.textContent="「＋」でリンクを追加"; webList.appendChild(e);
    document.querySelector('#tab-web .hint').style.visibility="hidden"; return;
  }
  document.querySelector('#tab-web .hint').style.visibility="visible";
  state.links.forEach(it=>{ webList.appendChild(isFolder(it)? makeFolderRow(it) : makeLinkRow(it)); });
}
function deleteFolder(id){
  const f=topById(id); if(!f) return;
  const msg = f.items.length? `フォルダ「${f.name}」と中の ${f.items.length} 件を削除しますか？` : `フォルダ「${f.name}」を削除しますか？`;
  if(!confirm(msg)) return;
  state.links=state.links.filter(x=>x.id!==id); save(); renderWeb();
}
function webTapItem(id){
  const it=topById(id);
  if(isFolder(it)) openFolder(id);
  else if(it && it.url) window.open(it.url,"_blank");
}
function webHold(id){
  const it=topById(id); if(!it) return;
  if(isFolder(it)){
    showSheet(it.name, [
      {label:"名前を変更", fn:()=>openRenameDlg(id)},
      {label:"削除", danger:true, fn:()=>deleteFolder(id)}
    ]);
  } else {
    showSheet(it.name, [
      {label:"編集", fn:()=>openLinkDlg(id)},
      {label:"削除", danger:true, fn:()=>{ state.links=state.links.filter(x=>x.id!==id); save(); renderWeb(); }}
    ]);
  }
}
attachGestures(webList, {
  folders:true, onTap:webTapItem, onHold:webHold,
  canMerge:(aId,bId)=>{ const a=topById(aId), b=topById(bId); return isLink(a) && (isLink(b)||isFolder(b)); },
  onDrop:({draggedId,mergeId,index})=>{
    const dIdx=state.links.findIndex(x=>x.id===draggedId); if(dIdx<0) return;
    const dragged=state.links[dIdx];
    if(mergeId){
      state.links.splice(dIdx,1);
      const tIdx=state.links.findIndex(x=>x.id===mergeId); if(tIdx<0){ state.links.splice(dIdx,0,dragged); return; }
      const target=state.links[tIdx];
      if(isFolder(target)){ target.items.push(dragged); save(); renderWeb(); }
      else { const nf={id:uid(), name:"フォルダ", items:[target, dragged]}; state.links.splice(tIdx,1,nf); save(); renderWeb(); openRenameDlg(nf.id, true); }
      return;
    }
    const others=state.links.filter(x=>x.id!==draggedId);
    const i=Math.max(0, Math.min(index==null?others.length:index, others.length));
    others.splice(i,0,dragged);
    state.links=others; save(); renderWeb();
  }
});

/* ---------- folder view ---------- */
const folderView=document.getElementById("folderView");
const folderList=document.getElementById("folderList");
const fvTitle=document.getElementById("fvTitle");
let openFolderId=null;
function currentFolder(){ return openFolderId? topById(openFolderId) : null; }
function openFolder(id){ const f=topById(id); if(!isFolder(f)) return; openFolderId=id; fvTitle.textContent=f.name; renderFolder(); folderView.classList.add("show"); }
function closeFolder(){ folderView.classList.remove("show"); openFolderId=null; }
function renderFolder(){
  const f=currentFolder(); if(!f){ closeFolder(); return; }
  fvTitle.textContent=f.name; folderList.innerHTML="";
  if(f.items.length===0){ const e=document.createElement("div"); e.className="empty"; e.textContent="空のフォルダ"; folderList.appendChild(e); return; }
  f.items.forEach(l=>{
    const row=document.createElement("div"); row.className="row"; row.dataset.id=l.id;
    const cell=document.createElement("div"); cell.className="cell";
    const name=document.createElement("div"); name.className="link-name"; name.textContent=l.name;
    const chev=document.createElement("div"); chev.className="chev"; chev.textContent="›";
    cell.appendChild(name); cell.appendChild(chev); row.appendChild(cell); folderList.appendChild(row);
  });
}
function afterFolderChange(){
  const f=currentFolder(); if(!f){ save(); renderWeb(); return; }
  if(f.items.length<=1){
    const idx=state.links.indexOf(f);
    if(f.items.length===1) state.links.splice(idx,1,f.items[0]); else state.links.splice(idx,1);
    save(); closeFolder(); renderWeb();
  } else { save(); renderFolder(); renderWeb(); }
}
function moveOut(id){ const f=currentFolder(); if(!f) return; const i=f.items.findIndex(x=>x.id===id); if(i<0) return; const [l]=f.items.splice(i,1); state.links.push(l); afterFolderChange(); }
function deleteInFolder(id){ const f=currentFolder(); if(!f) return; f.items=f.items.filter(x=>x.id!==id); afterFolderChange(); }
function folderItemHold(id){
  const l=findLinkAnywhere(id); if(!l) return;
  showSheet(l.name, [
    {label:"フォルダから出す", fn:()=>moveOut(id)},
    {label:"編集", fn:()=>openLinkDlg(id)},
    {label:"削除", danger:true, fn:()=>deleteInFolder(id)}
  ]);
}
attachGestures(folderList, {
  onTap:(id)=>{ const l=findLinkAnywhere(id); if(l&&l.url) window.open(l.url,"_blank"); },
  onHold:folderItemHold,
  onReorder:(ids)=>{ const f=currentFolder(); if(f){ f.items=reorderBy(f.items,ids); save(); } }
});
document.getElementById("fvBack").addEventListener("click", closeFolder);
document.getElementById("fvAdd").addEventListener("click", ()=>{ openLinkDlg(null, openFolderId); });
fvTitle.addEventListener("click", ()=>{ if(openFolderId) openRenameDlg(openFolderId); });

/* ---------- add / edit link dialog ---------- */
const linkMask=document.getElementById("linkMask");
const linkName=document.getElementById("linkName");
const linkUrl=document.getElementById("linkUrl");
let editId=null, addFolderId=null;
function openLinkDlg(id, folderId){
  editId=id||null; addFolderId=folderId||null;
  const l = id? findLinkAnywhere(id) : null;
  document.getElementById("linkDlgTitle").textContent = l? "リンクを編集" : "リンクを追加";
  linkName.value = l? l.name : ""; linkUrl.value = l? (l.url||"") : "";
  linkMask.classList.add("show"); setTimeout(()=>linkName.focus(),50);
}
function closeLinkDlg(){ linkMask.classList.remove("show"); editId=null; addFolderId=null; }
document.getElementById("webAdd").addEventListener("click", ()=>openLinkDlg());
document.getElementById("linkCancel").addEventListener("click", closeLinkDlg);
linkMask.addEventListener("click", e=>{ if(e.target===linkMask) closeLinkDlg(); });
document.getElementById("linkOk").addEventListener("click", ()=>{
  const n=linkName.value.trim(); const u=normalizeUrl(linkUrl.value);
  if(!n && !u) return;
  if(editId){ const l=findLinkAnywhere(editId); if(l){ l.name=n||u; l.url=u; } }
  else { const item={id:uid(), name:n||u, url:u}; if(addFolderId){ const f=topById(addFolderId); if(isFolder(f)) f.items.push(item); } else state.links.push(item); }
  save(); renderWeb(); if(openFolderId) renderFolder(); closeLinkDlg();
});
linkName.addEventListener("keydown", e=>{ if(e.key==="Enter") linkUrl.focus(); });
linkUrl.addEventListener("keydown", e=>{ if(e.key==="Enter") document.getElementById("linkOk").click(); });

const renameInput=document.getElementById("renameInput");

/* ---------- subscription cards (wallet) ---------- */
const cardStack=document.getElementById("cardStack");
const CARD_COLORS=["#3a6ea5","#c0562f","#4b8b6f","#6a5acd","#b5843a","#4a4a4a","#a63a5b","#2f7d8f"];
function fmtAmount(a){
  if(a==null || a==="") return "";
  const n=String(a).replace(/[^\d.\-]/g,"");
  if(n!=="" && /^-?\d+(\.\d+)?$/.test(n)) return "¥"+Number(n).toLocaleString();
  return a;
}
function renderCards(){
  cardStack.innerHTML="";
  if(state.cards.length===0){
    const e=document.createElement("div"); e.className="empty"; e.textContent="「＋」でサブスクを追加"; cardStack.appendChild(e);
    document.querySelector('#tab-cards .hint').style.visibility="hidden"; return;
  }
  document.querySelector('#tab-cards .hint').style.visibility="visible";
  state.cards.forEach(c=>{
    const el=document.createElement("div"); el.className="wcard";
    el.style.background=c.color||"#4a4a4a"; el.dataset.id=c.id;
    const head=document.createElement("div"); head.className="wc-head";
    const co=document.createElement("div"); co.className="wc-company"; co.textContent=c.company||"（会社名なし）";
    const ti=document.createElement("div"); ti.className="wc-title"; ti.textContent=c.item||"（品名なし）";
    head.appendChild(co); head.appendChild(ti);
    const body=document.createElement("div"); body.className="wc-body";
    if(c.amount){ const am=document.createElement("div"); am.className="wc-amount"; am.textContent="金額："+fmtAmount(c.amount); body.appendChild(am); }
    if(c.memo){ const mm=document.createElement("div"); mm.className="wc-memo"; mm.textContent=c.memo; body.appendChild(mm); }
    const acts=document.createElement("div"); acts.className="wc-actions";
    const ed=document.createElement("button"); ed.textContent="編集"; ed.addEventListener("click",ev=>{ev.stopPropagation(); openCardDlg(c.id);});
    const de=document.createElement("button"); de.textContent="削除"; de.addEventListener("click",ev=>{ev.stopPropagation();
      if(confirm("このサブスクを削除しますか？")){ state.cards=state.cards.filter(x=>x.id!==c.id); save(); renderCards(); } });
    acts.appendChild(ed); acts.appendChild(de); body.appendChild(acts);
    el.appendChild(head); el.appendChild(body);
    cardStack.appendChild(el);
  });
}
attachGestures(cardStack, {
  rowSelector:".wcard",
  onReorder:(ids)=>{ state.cards=reorderBy(state.cards,ids); save(); }
});
/* card dialog */
const cardMask=document.getElementById("cardMask");
const cCompany=document.getElementById("cCompany"), cItem=document.getElementById("cItem"),
      cAmount=document.getElementById("cAmount"), cMemo=document.getElementById("cMemo"),
      cSwatches=document.getElementById("cSwatches");
let cardEditId=null, cardColor=CARD_COLORS[0];
CARD_COLORS.forEach(col=>{
  const s=document.createElement("div"); s.className="sw"; s.style.background=col; s.dataset.col=col;
  s.addEventListener("click",()=>{ cardColor=col; cSwatches.querySelectorAll(".sw").forEach(x=>x.classList.toggle("on",x.dataset.col===col)); });
  cSwatches.appendChild(s);
});
function paintSwatches(){ cSwatches.querySelectorAll(".sw").forEach(x=>x.classList.toggle("on",x.dataset.col===cardColor)); }
function openCardDlg(id){
  cardEditId=id||null;
  const c=id? state.cards.find(x=>x.id===id) : null;
  document.getElementById("cardDlgTitle").textContent = c? "サブスクを編集" : "サブスクを追加";
  cCompany.value=c?c.company:""; cItem.value=c?(c.item||""):""; cAmount.value=c?(c.amount||""):""; cMemo.value=c?(c.memo||""):"";
  cardColor = c? (c.color||CARD_COLORS[0]) : CARD_COLORS[state.cards.length % CARD_COLORS.length];
  paintSwatches();
  cardMask.classList.add("show"); setTimeout(()=>cCompany.focus(),50);
}
function closeCardDlg(){ cardMask.classList.remove("show"); cardEditId=null; }
document.getElementById("cardAdd").addEventListener("click", ()=>openCardDlg());
document.getElementById("cardCancel").addEventListener("click", closeCardDlg);
cardMask.addEventListener("click", e=>{ if(e.target===cardMask) closeCardDlg(); });
document.getElementById("cardOk").addEventListener("click", ()=>{
  const company=cCompany.value.trim(), item=cItem.value.trim(), amount=cAmount.value.trim(), memo=cMemo.value.trim();
  if(!company && !item && !amount && !memo) return;
  if(cardEditId){ const c=state.cards.find(x=>x.id===cardEditId); if(c){ c.company=company; c.item=item; c.amount=amount; c.memo=memo; c.color=cardColor; } }
  else { const c={id:uid(), company, item, amount, memo, color:cardColor}; state.cards.push(c); }
  save(); renderCards(); closeCardDlg();
});

document.addEventListener("gesturestart", e=>e.preventDefault());

/* init */
renderCounter(); renderWeb(); renderTodo(); renderCards();
initCloud();
registerSW();

/* auto-update: if the deployed version differs, reload once to fetch the latest.
   Beats iOS Home-Screen HTML caching without needing to remove/re-add the app. */
const APP_VERSION="12";
document.getElementById("ver").textContent="v"+APP_VERSION;
fetch("version.json?"+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(d=>{
  if(d && d.v && d.v!==APP_VERSION){
    const k="upd_"+d.v;
    if(!sessionStorage.getItem(k)){ sessionStorage.setItem(k,"1"); location.reload(); }
  }
}).catch(()=>{});
</script>
</body>
</html>
